[project]
name = "pdf-4up-saddle-imposer"
version = "0.1.0"
description = "PDF 4-up A4 saddle-stitch imposition for small magazines/booklets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
]

[project.scripts]
pdf4up-saddle = "pdf4upimposer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf4upimposer"]

[tool.uv]
package = true
